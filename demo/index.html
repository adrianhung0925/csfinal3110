<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CS 3110 renderer demo</title>
    <style>
      body { background: #0b0d12; color: #ccc; font-family: sans-serif; margin: 20px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <p>Connect to the host, then use the arrow keys to move. Space launches the A1 assignment.</p>
    <label>
      WebSocket URL
      <input id="server-url" type="url" value="ws://127.0.0.1:9001" />
    </label>
    <label>
      Client ID
      <input id="client-id" type="text" value="student-1" />
    </label>
    <button id="connect-button" type="button">Connect</button>
    <p id="connection-status">Not connected</p>
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <script src="../_build/default/demo/demo.bc.js"></script>
  </body>
</html>
