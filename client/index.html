<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Survive the Hump Day: client</title>
  <style>
    body { background: #0b0d12; color: #ccc; font-family: monospace; margin: 20px; }
    canvas { display: block; margin: 10px 0; }
    #join-error { color: #f77; }
    pre { background: #151923; padding: 8px; height: 160px; overflow: auto; }
  </style>
</head>
<body>
  <form>
    <label>Username <input id="name" maxlength="32" autocomplete="off"></label>
    <button id="join">Join</button>
    <span id="join-error"></span>
  </form>
  <p>
    Standing: <span id="standing"></span> &middot;
    GPA: <span id="gpa">-</span> &middot;
    Time left: <span id="time">-</span> &middot;
    Held keys: <span id="held"></span>
  </p>
  <p>Arrow keys move your square. Local mode only: press 1 to make the Professor launch Assignments.</p>
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <pre id="log"></pre>
  <script src="../_build/default/client/client.bc.js"></script>
</body>
</html>
